# любой параметр можно переопределить: mvn test -Dимя=значение

appium.url=http://127.0.0.1:4723

# путь от корня проекта или абсолютный
app.path=app/alfa-test.apk
app.package=com.alfabank.qapp
app.activity=.presentation.MainActivity

# если подключено несколько устройств (adb devices)
device.udid=

# секунды
timeout.explicit=10
# логин в приложении занимает ~2 сек
timeout.login=15
appium.newCommandTimeout=120

# из README задания
user.login=Login
user.password=Password
